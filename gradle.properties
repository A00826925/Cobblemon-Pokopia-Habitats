org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true

# Mod
mod_id=pokopia
mod_name=Cobblemon Pokopia
mod_version=1.0.0
mod_group=com.pokopia
mod_authors=A00826925
mod_description=Pokopia-style habitat spawn mechanics for Cobblemon. Build habitats out of blocks, scan them with the Habitat Scanner, and watch Pokemon move in.

# Minecraft
minecraft_version=1.21.1
mc_version_range=[1.21.1,1.21.2)

# Toolchain
enabled_platforms=fabric,neoforge
archives_base_name=cobblemon-pokopia
# Kotlin 2.2.20 matches KotlinForForge 5.10.0; Architectury Loom 1.14+ ships
# kotlin-metadata-jvm 2.2.x so it can remap this Kotlin metadata version.
kotlin_version=2.2.20

# Architectury
architectury_api_version=13.0.11

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.115.6+1.21.1
fabric_kotlin_version=1.12.3+kotlin.2.0.21

# NeoForge
neoforge_version=21.1.182
neoforge_version_range=[21.1.0,)
kotlinforforge_version=5.10.0
kff_version_range=[5.5,)

# Cobblemon
cobblemon_version=1.6.1+1.21.1
cobblemon_version_range=[1.6,)
